services:
  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    ports:
      - "6380:6379" # پورت 6380 هاست به 6379 کانتینر
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - ledger-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-guard-app
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledger-network

volumes:
  redis_data:

networks:
  ledger-network:
    driver: bridge